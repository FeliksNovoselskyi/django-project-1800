{% extends "base.html" %}
{% load static %}

{% block links %}
    <link rel="stylesheet" href="{% static 'blog_app/css/style.css' %}">
{% endblock %}

{% block content %}
    <p>MAIN PAGE</p>

    {% for post in posts_list %}
        <div style = "display: flex; flex-direction: column; width: 500px; height: auto; color: #ffffff; border: 1px solid black; border-radius: 10px; background-color: rgb(194, 131, 175); padding: 10px; margin-bottom: 10px;">
            <h3 style="margin-bottom: 10px; color: rgb(117, 15, 92);">{{ post.title }}</h3>
            <p>by {{ post.author.name }}</p>
            <p style="font-style: italic;">{{ post.content }}</p>
            <p>{{ post.is_publish }}</p>
            <a href="{{ post.get_absolute_url }}">читати більше</a>
        </div>
    {% endfor %}
{% endblock %}
